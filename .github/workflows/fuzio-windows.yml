# Fúzió fork: SolidCraft for Windows 10/11 (x64) from the `fuzio` branch — a portable zip, an MSI
# installer and the bare .exe, as a downloadable artifact of the run (Actions → this run → Artifacts).
# Runs by hand (Run workflow) or on every push to `fuzio`. Nothing is signed (SmartScreen warns once).
name: Fuzio Windows build

on:
  workflow_dispatch:
  push:
    branches: [fuzio]
    paths-ignore: ["**/*.md", "docs/**", "tests/oracle/**"]

permissions:
  contents: read

concurrency:
  group: fuzio-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuzio-windows-x64
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package (msi, portable zip, exe)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidcraft-fuzio-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
